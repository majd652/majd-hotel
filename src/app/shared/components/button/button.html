<button
  [type]="type()"
  class="btn"
  [class]="'btn--' + variant() + ' btn--' + size()"
  [class.btn--loading]="loading()"
  [disabled]="disabled() || loading()"
  (click)="handleClick($event)"
>
  @if (loading()) {
    <span class="btn__spinner" aria-hidden="true"></span>
  }
  <ng-content />
</button>
