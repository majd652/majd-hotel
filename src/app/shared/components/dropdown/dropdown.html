<div class="field">
  @if (label()) { <label class="field__label" [for]="selectId">{{ label() }}</label> }

  <select
    [id]="selectId"
    class="field__control"
    [class.field__control--error]="errorMessage()"
    [disabled]="disabled"
    [value]="currentValue ?? ''"
    (change)="onSelect($event)"
    (blur)="onTouched()"
  >
    <option value="" disabled>{{ placeholder() }}</option>
    @for (opt of options(); track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>

  @if (errorMessage()) { <p class="field__error">{{ errorMessage() }}</p> }
</div>
